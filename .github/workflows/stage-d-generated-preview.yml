name: Stage D Generated Preview

on:
  push:
    branches: [VXG-091126-vw-fwd-01d-first-grove]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-source-map:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'VXG-091126-vw-fwd-01d-first-grove'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Stage D candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate compiler-owned First Grove projection
        run: npm --prefix versions/v1 run compile

      - name: Upload generated source map only
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-first-grove-generated-source-map
          path: versions/v1/generated/first-grove.source-map.json
          if-no-files-found: error

