name: Stage D Browser Self-Play

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-self-play:
    if: github.event.pull_request.head.ref == 'VXG-091126-vw-fwd-01d-first-grove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Stage D candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve installed Chromium-family browser
        shell: bash
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_PATH" ]; then
            echo "No Chromium-family browser present on runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$BROWSER_PATH" >> "$GITHUB_ENV"
          echo "browser=$BROWSER_PATH"

      - name: Compile current First Grove package
        run: npm --prefix versions/v1 run compile

      - name: Run bounded Vex Relay browser self-play
        id: selfplay
        shell: bash
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 90s \
            npm run selfplay -- --out="${RUNNER_TEMP}/vexworld-stage-d-selfplay"
          SELFPLAY_STATUS=$?
          set -e
          echo "process_status=$SELFPLAY_STATUS" >> "$GITHUB_OUTPUT"
          echo "selfplayProcessStatus=$SELFPLAY_STATUS"
          RECEIPT="${RUNNER_TEMP}/vexworld-stage-d-selfplay/latest.json"
          if [ ! -f "$RECEIPT" ]; then
            echo "No self-play receipt was produced before process exit/timeout" >&2
            exit 1
          fi
          node - "$RECEIPT" "$SELFPLAY_STATUS" <<'NODE'
          const fs = require('node:fs');
          const [receiptPath, statusText] = process.argv.slice(2);
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          const status = Number(statusText);
          console.log(JSON.stringify({
            disposition: receipt.disposition,
            processStatus: status,
            screenshots: receipt.screenshots?.length ?? 0,
            pageErrors: receipt.pageErrors ?? [],
            consoleErrors: receipt.consoleErrors ?? [],
            assertions: receipt.assertions ?? null
          }, null, 2));
          if (receipt.disposition !== 'PASS_WITH_HUMAN_FEEL_STILL_UNWITNESSED') process.exit(2);
          if (![0, 124].includes(status)) process.exit(status || 3);
          if (status === 124) console.warn('Self-play evidence completed, but process cleanup exceeded the bounded 90s window. Evidence is valid; cleanup remains an observable harness concern.');
          NODE

      - name: Upload Stage D browser witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-browser-selfplay
          path: ${{ runner.temp }}/vexworld-stage-d-selfplay/**
          if-no-files-found: warn

      - name: Enforce self-play receipt gate
        if: always()
        shell: bash
        run: |
          RECEIPT="${RUNNER_TEMP}/vexworld-stage-d-selfplay/latest.json"
          if [ ! -f "$RECEIPT" ]; then
            echo "Missing self-play receipt" >&2
            exit 1
          fi
          node - "$RECEIPT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (receipt.disposition !== 'PASS_WITH_HUMAN_FEEL_STILL_UNWITNESSED') {
            console.error(JSON.stringify({
              disposition: receipt.disposition,
              pageErrors: receipt.pageErrors ?? [],
              consoleErrors: receipt.consoleErrors ?? [],
              assertions: receipt.assertions ?? null
            }, null, 2));
            process.exit(2);
          }
          NODE

# Automated self-play is browser evidence, not human game-feel evidence.
# A cleanup timeout is never accepted unless the completed receipt itself is PASS.
# Failure artifacts are preserved so a fresh witness can inspect the actual browser evidence.
# [VXG RealForever]
